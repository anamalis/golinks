[project]
name = "golinks"
version = "0.1.0"
description = "Internal go-links service: short, human-readable names that redirect to long URLs."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
